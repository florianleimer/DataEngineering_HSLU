id: taxi_restart_three_scripts
namespace: deng.week5

inputs:
  - id: year
    type: INT
    defaults: 2024
  - id: month
    type: INT
    defaults: 1
    min: 1
    max: 12

triggers:
  - id: monthly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "@monthly"

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: deng-week5-ingest:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: "{{ envs.taxi_network }}"
      entryPoint: []
    commands:
      - >-
        python /app/extract_month.py 
        --year {{ trigger.date is defined ? (trigger.date | date("yyyy")) : inputs.year }} 
        --month {{ trigger.date is defined ? (trigger.date | date("M")) : inputs.month }}
        --output {{ workingDir }}/source.parquet
    outputFiles:
      - source.parquet

  - id: transform
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: deng-week5-ingest:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: "{{ envs.taxi_network }}"
      entryPoint: []
    inputFiles:
      source.parquet: "{{ outputs.extract.outputFiles['source.parquet'] }}"
    commands:
      - python /app/transform_month.py --input {{ workingDir }}/source.parquet --output {{ workingDir }}/transformed.csv
    outputFiles:
      - transformed.csv

  - id: load
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: deng-week5-ingest:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: "{{ envs.taxi_network }}"
      entryPoint: []
      # Only the practice marker is read from the host.
      volumes:
        - "{{ envs.taxi_data_dir }}:/app/data:ro"
    inputFiles:
      transformed.csv: "{{ outputs.transform.outputFiles['transformed.csv'] }}"
    env:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "{{ envs.taxi_db }}"
      POSTGRES_USER: "{{ envs.taxi_user }}"
      POSTGRES_PASSWORD: "{{ envs.taxi_password }}"
    commands:
      - >-
        test -f /app/data/load_ready || (echo 'Practice failure: create data/load_ready, then restart this execution.'; exit 1)
      - >-
        python /app/load_month.py 
        --year {{ trigger.date is defined ? (trigger.date | date("yyyy")) : inputs.year }} 
        --month {{ trigger.date is defined ? (trigger.date | date("M")) : inputs.month }} 
        --input {{ workingDir }}/transformed.csv

# Correction after the failed run: create the marker file locally, without
# editing this flow, then use Restart on the same failed execution:
#   touch data/load_ready
# On Restart, Load receives transformed.csv from the outputs that Transform
# stored in the original execution.