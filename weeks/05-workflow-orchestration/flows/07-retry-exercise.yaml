id: taxi_retry_exercise
namespace: deng.week5

tasks:
  - id: temporary_failure
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: deng-week5-ingest:local
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: "{{ envs.taxi_network }}"
      entryPoint: []
      volumes:
        - "{{ envs.taxi_data_dir }}:/app/data"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 2
    commands:
      - |
        if [ ! -f /app/data/retried ]; then
          echo '/app/data/retried is missing because this was never executed'
          touch /app/data/retried
          exit 1
        fi
        echo 'Retry succeeded, /app/data/retried exists'
